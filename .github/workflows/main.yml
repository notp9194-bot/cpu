name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

defaults:
  run:
    working-directory: DeviceInfo

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Ensure gradle.properties has AndroidX enabled
        run: |
          if ! grep -q "android.useAndroidX" gradle.properties 2>/dev/null; then
            echo "android.useAndroidX=true" >> gradle.properties
            echo "android.nonTransitiveRClass=true" >> gradle.properties
            echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> gradle.properties
            echo "kotlin.code.style=official" >> gradle.properties
          fi

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('DeviceInfo/**/*.gradle*', 'DeviceInfo/**/gradle-wrapper.properties', 'DeviceInfo/**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Run Unit Tests
        run: ./gradlew test --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DeviceInfo-debug-apk
          path: DeviceInfo/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: DeviceInfo/**/build/reports/tests/
          retention-days: 7

  release:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Ensure gradle.properties has AndroidX enabled
        run: |
          if ! grep -q "android.useAndroidX" gradle.properties 2>/dev/null; then
            echo "android.useAndroidX=true" >> gradle.properties
            echo "android.nonTransitiveRClass=true" >> gradle.properties
            echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> gradle.properties
            echo "kotlin.code.style=official" >> gradle.properties
          fi

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('DeviceInfo/**/*.gradle*', 'DeviceInfo/**/gradle-wrapper.properties', 'DeviceInfo/**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 🔐 Keystore secrets se local.properties banao
      - name: Create local.properties for signing
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > keystore.jks
          echo "KEYSTORE_FILE=keystore.jks" >> local.properties
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> local.properties
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> local.properties
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> local.properties

      # 📦 AAB build (Play Store ke liye)
      - name: Build Release AAB
        run: ./gradlew bundleRelease --stacktrace

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: DeviceInfo-release-aab
          path: DeviceInfo/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      # APK bhi banao (sideload ke liye)
      - name: Build Release APK (unsigned fallback)
        if: env.KEYSTORE_BASE64 == ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Release APK
        if: env.KEYSTORE_BASE64 == ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        uses: actions/upload-artifact@v4
        with:
          name: DeviceInfo-release-apk
          path: DeviceInfo/app/build/outputs/apk/release/*.apk
          retention-days: 30
          
